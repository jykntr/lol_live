name: 'Install Linux Dependencies'
description: 'Installs system libraries for Linux'
runs:
  using: "composite"
  steps:
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update 
        sudo apt-get install -y \
          pkg-config \
          clang \
          libleptonica-dev \
          libtesseract-dev \
          tesseract-ocr \
          libwayland-dev \
          libwayland-bin \
          libxkbcommon-dev \
          libdbus-1-dev \
          libxcb1-dev \
          libxrandr-dev \
          libpipewire-0.3-dev \
          libspa-0.2-dev \
          libegl1-mesa-dev \
          libgbm-dev \
          libdrm-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install tesseract leptonica
      shell: bash

