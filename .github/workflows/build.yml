on:
  push:
    branches:
      - '**'

name: Build and Check

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache setup
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache setup
        uses: Swatinem/rust-cache@v2

      - name: Cargo test
        run: cargo test

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache setup
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache setup
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy
        run: cargo clippy --all-features

  build:
    name: Build

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    #          - os: macos-latest
    #            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install leptonica:x64-windows-static-md tesseract:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Rust cache setup
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol_live-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/lol_live${{ contains(matrix.target, 'windows') && '.exe' || '' }}
